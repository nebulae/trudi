name: Custom.TRUDI.Respond.KillSession
description: |
  TRUDI remediation: SIGKILL the sshd session pid of a lateral inbound SSH
  session. Gated by the respond.* approval workflow; never invoked directly
  by a detector. Irreversible.

type: CLIENT

parameters:
  - name: Pid
    description: sshd session PID to kill. Integer > 1 (refuses init).
    type: int

sources:
  - query: |
      LET valid <= Pid > 1 AND Pid < 4194304
      SELECT
        Pid AS pid,
        valid AS valid_pid,
        if(condition=valid,
           then=execve(argv=["/bin/kill", "-9", format(format="%d", args=[Pid])]),
           else=dict(stdout="", stderr="invalid PID", return_code=2)
        ) AS execution
      FROM scope()
